[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepigeon"
version = "0.1.0"
description = "Bot for playing GamePigeon games via iPhone Mirroring on macOS"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.0.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ScreenCaptureKit>=10.0",
    "pyobjc-framework-libdispatch>=10.0",
    "pytesseract>=0.3.10",
]

[project.scripts]
gamepigeon = "gamepigeon.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gamepigeon*"]

[tool.setuptools.package-data]
"gamepigeon.words" = ["data/*.txt"]
